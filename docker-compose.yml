services:
  db:
    image: postgres:16-alpine
    container_name: deco-eventos-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deco
      POSTGRES_PASSWORD: deco_dev_local
      POSTGRES_DB: deco_eventos
    ports:
      # 5432 está ocupado en este equipo por un Postgres nativo ajeno al
      # proyecto; se mapea a 5433 en el host para no chocar con él.
      - "5433:5432"
    volumes:
      - deco_eventos_db_data:/var/lib/postgresql/data

volumes:
  deco_eventos_db_data:
